name: sari_scan_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.16.0
  http: ^1.2.2
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.5
  pdf: ^3.13.0
  printing: ^5.15.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  image: ^4.9.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sariscan_logo.png
    - assets/branding/sariscan_symbol.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
